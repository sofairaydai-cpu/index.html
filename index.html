<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome 🫧❄️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f4f8fb;
            font-family: sans-serif;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 119, 182, 0.1);
            width: 100%;
            max-width: 320px;
            border: 2px solid #0077b6;
        }

        .bubble-btn {
            background: #e2eafc;
            border: none;
            font-size: 60px;
            padding: 20px;
            border-radius: 50%;
            cursor: pointer;
            margin-bottom: 20px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s ease;
        }

        .bubble-btn:active {
            transform: scale(0.9);
        }

        .text {
            font-size: 15px;
            color: #1d3557;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .bar-container {
            width: 100%;
            height: 16px;
            background: #e2eafc;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0077b6, #48cae4);
            border-radius: 8px;
            transition: width 0.1s ease-out;
        }

        .sub-text {
            font-size: 12px;
            color: #6c757d;
        }

        .success-box {
            display: none;
            margin-top: 15px;
        }

        .next-btn {
            background: #0077b6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <button class="bubble-btn" id="clickBtn">🫧</button>
        <div class="text" id="statusText">จิ้มฟองสบู่ให้ครบ 5 ครั้ง!</div>
        
        <div class="bar-container" id="barBox">
            <div class="bar-fill" id="barFill"></div>
        </div>
        <div class="sub-text" id="subText">0 / 5 ครั้ง</div>

        <div class="success-box" id="successBox">
            <button class="next-btn" id="nextBtn">ไปหน้าถัดไป 🚀</button>
        </div>
    </div>

    <script>
        const clickBtn = document.getElementById('clickBtn');
        const statusText = document.getElementById('statusText');
        const barFill = document.getElementById('barFill');
        const subText = document.getElementById('subText');
        const barBox = document.getElementById('barBox');
        const successBox = document.getElementById('successBox');
        const nextBtn = document.getElementById('nextBtn');

        let count = 0;
        const target = 5;

        // รองรับทั้งคลิกและทัชสกรีนมือถือแบบตรงไปตรงมา
        function triggerAction(e) {
            e.preventDefault();
            if (count >= target) return;

            count++;
            let percent = (count / target) * 100;
            barFill.style.width = percent + '%';
            subText.innerText = `${count} / ${target} ครั้ง`;
            statusText.innerText = `เก่งมาก! อีกนิดเดียว`;

            if (count >= target) {
                statusText.innerText = 'สำเร็จแล้ว! 🎉';
                barBox.style.display = 'none';
                subText.style.display = 'none';
                clickBtn.style.display = 'none';
                successBox.style.display = 'block';
            }
        }

        clickBtn.addEventListener('click', triggerAction);
        clickBtn.addEventListener('touchend', triggerAction);

        nextBtn.addEventListener('click', function() {
            alert(' เย้! กดทะลุผ่านแล้ว ขั้นต่อไปใส่ลิงก์หน้า Bio จริงได้เลย!');
            // window.location.href = 'bio.html'; // เปิดใช้บรรทัดนี้ถ้าจะให้ลิงก์ไปหน้าอื่นต่อ
        });
    </script>
</body>
</html>
